name: Compiler validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SKITE_ARTIFACT_DIR: /tmp/skite-fuzz-artifacts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Clean build, fixed point, regressions and fuzz smoke tests
        run: make clean && make test
      - name: Previously failing control-flow seed
        run: timeout 120 ./tests/run_cf_fuzz.sh 100 23 1 1 1 1
      - name: Constant-divisor oracle
        run: timeout 120 ./tests/run_divconst.sh
      - name: LLVM backend (regressions, Game/kernel outputs, oracle fuzzers via clang)
        run: timeout 900 make test-llvm
      - name: Preserve fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-evidence
          path: ${{ env.SKITE_ARTIFACT_DIR }}
          if-no-files-found: ignore
          retention-days: 14
